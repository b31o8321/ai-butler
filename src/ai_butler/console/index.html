<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ai-butler 控制台</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
         background: #14100c; color: #e8dcc4; }
  header { display: flex; align-items: baseline; gap: 14px;
           padding: 18px 26px; border-bottom: 1px solid #4d3f2a; }
  header h1 { margin: 0; font-size: 20px; color: #f2e6c8; }
  header span { color: #b3a488; font-size: 12px; }
  main { padding: 22px 26px; display: grid; gap: 16px; max-width: 960px; margin: 0 auto; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; }
  .card { border: 1px solid #4d3f2a; border-radius: 10px; padding: 16px 18px;
          background: #262019; min-width: 260px; flex: 1; }
  .card h3 { margin: 0 0 8px; font-size: 15px; color: #f2e6c8; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%;
         margin-right: 8px; vertical-align: middle; }
  .ok { background: #9ab073; } .down { background: #d4744a; }
  .off { background: #6f5c40; }
  .meta { color: #b3a488; font-size: 12.5px; line-height: 1.7; }
  .pill { border: 1px solid #63513a; border-radius: 999px; padding: 2px 9px;
          font-size: 11px; color: #c9b998; margin-right: 6px; }
  #updated { color: #6f5c40; font-size: 11px; }
  code { color: #e8c68e; }
</style>
</head>
<body>
<header>
  <h1>ai-butler 控制台</h1>
  <span id="version"></span>
  <span style="margin-left:auto" id="updated"></span>
</header>
<main>
  <div class="row" id="adapters"></div>
  <div class="row">
    <div class="card" style="flex:2">
      <h3>硬件</h3>
      <div class="meta" id="hardware">loading…</div>
    </div>
    <div class="card" style="flex:1">
      <h3>运行时管理</h3>
      <div class="meta" id="runtimes">loading…</div>
    </div>
  </div>
  <div class="card">
    <h3>预设包频道</h3>
    <div class="meta" id="channels">loading…</div>
  </div>
  <div class="card">
    <h3>策略 / 路由</h3>
    <div class="meta" id="policy">loading…</div>
  </div>
</main>
<script>
const dot = ok => `<span class="dot ${ok ? 'ok' : 'down'}"></span>`;
const esc = s => String(s ?? '').replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

async function refresh() {
  try {
    const r = await fetch('/admin/status');
    const s = await r.json();
    document.getElementById('version').textContent = 'v' + s.version;
    document.getElementById('updated').textContent =
      '更新于 ' + new Date().toLocaleTimeString();
    document.getElementById('adapters').innerHTML = s.adapters.map(a => `
      <div class="card">
        <h3>${dot(a.ok)}${esc(a.name)}</h3>
        <div class="meta">
          ${a.enabled ? '' : '<span class="pill">已在配置中禁用</span>'}
          ${esc(a.detail || '')}
          ${(a.models && a.models.length) ? '<br>模型: ' + a.models.slice(0, 6).map(esc).join(', ') +
            (a.models.length > 6 ? ` 等 ${a.models.length} 个` : '') : ''}
        </div>
      </div>`).join('');
    document.getElementById('policy').innerHTML =
      `并发上限 <code>${s.policy.max_concurrent_tasks}</code> ·
       GPU 独占窗口 <code>${s.policy.gpu_exclusive_window_minutes} 分钟</code><br>
       LLM 优先: <code>${esc((s.routes.llm_prefer || []).join(', ') || '-')}</code> ·
       回退: <code>${esc((s.routes.llm_fallback || []).join(', ') || '-')}</code>`;
  } catch (e) {
    document.getElementById('updated').textContent = '无法连接内核: ' + e;
  }
}

const gb = b => (b == null ? '?' : (b / 1073741824).toFixed(1) + ' GB');

async function loadHardware() {
  try {
    const h = await (await fetch('/admin/hardware')).json();
    const gpu = (h.gpus || []).map(g =>
      `${esc(g.name || '?')}${g.vram_bytes ? ' · 显存 ' + gb(g.vram_bytes) : ''}`).join('<br>') || '未检测到';
    document.getElementById('hardware').innerHTML =
      `<b>GPU</b><br>${gpu}<br>
       <b>内存</b> 空闲 ${gb(h.ram.free_bytes)} / 共 ${gb(h.ram.total_bytes)}<br>` +
      (h.disks || []).map(d => `<b>磁盘 ${esc(d.path)}</b> 空闲 ${gb(d.free_bytes)}`).join('<br>');
  } catch (e) {
    document.getElementById('hardware').textContent = '检测失败: ' + e;
  }
}

async function loadRuntimes() {
  try {
    const r = await (await fetch('/admin/runtimes')).json();
    document.getElementById('runtimes').innerHTML = r.runtimes.map(rt => `
      <div style="margin-bottom:10px">
        ${dot(rt.alive)}<b>${esc(rt.name)}</b>
        ${rt.start_configured
          ? `<button style="float:right;padding:3px 10px;font-size:12px"
              onclick="runtimeAction('${esc(rt.name)}','${rt.managed_pid ? 'stop' : 'start'}')">
              ${rt.managed_pid ? '停止' : '启动'}</button>`
          : '<span class="pill">只读</span>'}
        <div class="meta">${esc(rt.detail || '')}
          ${rt.managed_pid ? '<br>托管 PID: ' + rt.managed_pid : ''}</div>
      </div>`).join('');
  } catch (e) {
    document.getElementById('runtimes').textContent = '加载失败: ' + e;
  }
}

async function runtimeAction(name, action) {
  await fetch(`/admin/runtimes/${name}/${action}`, { method: 'POST' });
  await loadRuntimes();
}

const statePill = st => {
  const map = { present: 'ok', missing: 'down', runtime: 'off', unknown: 'off' };
  return `<span class="dot ${map[st] || 'off'}"></span>`;
};

async function loadChannels() {
  try {
    const data = await (await fetch('/admin/channels')).json();
    document.getElementById('channels').innerHTML = data.channels.map(ch => {
      if (ch.error) return `<b>${esc(ch.name)}</b><div class="meta">错误: ${esc(ch.error)}</div>`;
      const models = ch.models.map(m =>
        `${statePill(m.state)}${esc(m.name)} <small>(${m.state})</small>`).join('<br>');
      const btn = ch.missing_count > 0
        ? `<button style="float:right;padding:4px 12px;font-size:12px"
             onclick="installChannel('${esc(ch.id)}')">安装缺失 ${ch.missing_count} 项</button>`
        : '<span class="pill">全部就绪</span>';
      return `<div style="border-top:1px dashed #4d3f2a;padding-top:10px;margin-top:10px">
        <b>${esc(ch.name)}</b> ${btn}
        <div class="meta">${esc(ch.description || '')}</div>
        <div class="meta" style="margin-top:6px">${models}</div>
        ${ch.presets.length ? `<div class="meta">预设: ${ch.presets.map(esc).join(', ')}</div>` : ''}
      </div>`;
    }).join('') || '无频道';
  } catch (e) {
    document.getElementById('channels').textContent = '加载失败: ' + e;
  }
}

async function installChannel(id) {
  const r = await (await fetch(`/admin/channels/${id}/install`, { method: 'POST' })).json();
  document.getElementById('channels').insertAdjacentHTML('beforeend',
    `<div class="meta">安装任务已提交: <code>${esc(r.task_id)}</code>（在任务列表追踪）</div>`);
}

refresh();
loadHardware();
loadRuntimes();
loadChannels();
setInterval(refresh, 15000);
setInterval(loadRuntimes, 15000);
setInterval(loadChannels, 30000);
</script>
</body>
</html>
