# 网关自身配置（不入 git 的密钥放密钥库/.env）
server:
  host: 0.0.0.0
  port: 9000

routes:
  llm:
    prefer: [ollama, lmstudio]     # 优先本地运行时
    fallback: []                   # 可挂 plan-adapter / 云端
policy:
  gpu_exclusive_window: { minutes: 30 }   # ComfyUI 生图期间 LLM 走回退
  max_concurrent_tasks: 1

adapters:
  comfyui:  { enabled: true }
  ollama:   { enabled: true }
  lmstudio: { enabled: true }
  plan:     { enabled: false }     # ToS 风险自担

# 运行时生命周期（S2）：start_command 必须是列表形式；留空 = 只读监控
# 安全规则：manager 只按它自己启动的 PID 停止进程
# runtimes:
#   ollama:
#     url: "http://127.0.0.1:11434"
#     start_command: ["ollama", "serve"]
#   comfyui:
#     url: "http://127.0.0.1:8188"
#     # start_command: ["cmd", "/c", "F:\\ComfyUI\\run_nvidia_gpu.bat"]
