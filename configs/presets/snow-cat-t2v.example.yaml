# 生成预设示例：数据驱动的"工作流+参数+注入映射"
# 内核不认识 CLIPTextEncode——它只按 inject 映射把值写进节点字段
name: 雪景猫-t2v
kind: text-to-video
adapter: comfyui
workflow: workflows/snow_cat_t2v.json     # ComfyUI 导出的 API 格式
defaults:
  width: 832
  height: 480
  length: 81
  fps: 16
  steps: 4
  boundary: 2
  cfg: 1.0
inputs:
  - { name: prompt, type: string, required: true, max: 4000 }
  - { name: seed, type: seed }
inject:
  - { node: "15", field: text, from: prompt }
  - { node: "30", field: noise_seed, from: seed }
  - { node: "17", field: length, from: length }
policy: { queue: gpu, priority: normal }
